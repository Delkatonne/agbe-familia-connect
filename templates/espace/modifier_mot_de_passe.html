{% extends "base.html" %}

{% block title %}Changer mon mot de passe — AGBE FAMILY{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Changer mon mot de passe</h2>

    <form method="POST" class="auth-form">
        <label for="ancien_mot_de_passe">Mot de passe actuel</label>
        <div class="champ-mot-de-passe">
            <input type="password" id="ancien_mot_de_passe" name="ancien_mot_de_passe" required>
            <button type="button" class="btn-oeil" onclick="basculerVisibiliteMotDePasse('ancien_mot_de_passe', this)" aria-label="Afficher le mot de passe">👁</button>
        </div>

        <label for="nouveau_mot_de_passe">Nouveau mot de passe</label>
        <div class="champ-mot-de-passe">
            <input type="password" id="nouveau_mot_de_passe" name="nouveau_mot_de_passe" required>
            <button type="button" class="btn-oeil" onclick="basculerVisibiliteMotDePasse('nouveau_mot_de_passe', this)" aria-label="Afficher le mot de passe">👁</button>
        </div>

        <label for="confirmation">Confirmer le nouveau mot de passe</label>
        <div class="champ-mot-de-passe">
            <input type="password" id="confirmation" name="confirmation" required>
            <button type="button" class="btn-oeil" onclick="basculerVisibiliteMotDePasse('confirmation', this)" aria-label="Afficher le mot de passe">👁</button>
        </div>

        <button type="submit" class="btn">Enregistrer le nouveau mot de passe</button>
    </form>

    <p class="form-footer">
        <a href="{{ url_for('espace.index') }}">← Retour à mon espace</a>
    </p>
</section>
{% endblock %}
