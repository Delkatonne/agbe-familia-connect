{% extends "base.html" %}

{% block title %}Modifier mon profil — AGBE FAMILY{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Modifier mes informations</h2>

    <form method="POST" class="auth-form">
        <label for="nom_profil">Nom de profil</label>
        <input type="text" id="nom_profil" name="nom_profil"
               value="{{ (mon_profil.nom if mon_profil else current_user.nom_profil) or current_user.nom }}" required>

        <label for="date_naissance">Date de naissance</label>
        <input type="date" id="date_naissance" name="date_naissance"
               value="{{ mon_profil.date_naissance.isoformat() if mon_profil and mon_profil.date_naissance else '' }}">

        <label for="profession">Profession(s)</label>
        <input type="text" id="profession" name="profession"
               value="{{ mon_profil.profession if mon_profil else '' }}" placeholder="ex : Étudiant, Développeur">

        <label for="biographie">À propos de moi</label>
        <textarea id="biographie" name="biographie" rows="4">{{ mon_profil.biographie if mon_profil else '' }}</textarea>

        <button type="submit" class="btn">Enregistrer</button>
    </form>

    <p class="form-footer">
        <a href="{{ url_for('espace.index') }}">← Retour à mon espace</a>
    </p>
</section>
{% endblock %}
