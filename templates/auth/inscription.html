{% extends "base.html" %}

{% block title %}Inscription — AGBE FAMILY{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Créer un compte</h2>

    <form method="POST" class="auth-form">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" value="{{ nom or '' }}" required>

        <label for="nom_profil">Nom de profil (affiché sur le site)</label>
        <input type="text" id="nom_profil" name="nom_profil" value="{{ nom_profil or '' }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>

        <label for="date_naissance">Date de naissance</label>
        <input type="date" id="date_naissance" name="date_naissance" required>

        <label for="profession">Profession(s)</label>
        <input type="text" id="profession" name="profession" value="{{ profession or '' }}" placeholder="ex : Étudiant, Développeur">

        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required>

        <label for="confirmation">Confirmer le mot de passe</label>
        <input type="password" id="confirmation" name="confirmation" required>

        <button type="submit" class="btn">S'inscrire</button>
    </form>

    <p class="form-footer">
        Déjà un compte ? <a href="{{ url_for('auth.login') }}">Connectez-vous</a>
    </p>
</section>
{% endblock %}
